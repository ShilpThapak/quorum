# Render Blueprint — Quorum grader (grader only).
# The web app deploys as a separate Static Site with VITE_API_BASE pointing
# here; this service answers /api/* (CORS-enabled for that cross-origin call).
services:
  - type: web
    name: quorum-grader
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    dockerfilePath: ./server/Dockerfile
    envVars:
      - key: QUORUM_QUESTIONS
        value: /app/questions-src
